name: TELUGU DEVOTEE Production Manifest Export

# Manual utility workflow: recovers an existing episode artifact; does not call Gemini.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing Episode Package workflow run ID"
        required: true
        default: "38144490097"
      episode_artifact_name:
        description: "Artifact name from that run"
        required: true
        default: "telugu-devotee-episode-2"

permissions:
  actions: read
  contents: read

jobs:
  export-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recover existing episode package (no Gemini API call)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output

      - name: Check episode package exists
        run: |
          if [ ! -f output/episode_package.md ]; then
            echo "::error::Artifact did not contain output/episode_package.md. Check the source run ID and artifact name."
            find output -maxdepth 2 -type f -print || true
            exit 1
          fi

      - name: Export scene manifest
        run: python scripts/export_production_assets.py

      - name: Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: telugu-devotee-production-manifest
          path: |
            output/production_manifest.csv
            output/production_manifest.json
          if-no-files-found: error
          retention-days: 30
