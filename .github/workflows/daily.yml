
name: TELUGU DEVOTEE Daily Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  daily-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "TELUGU DEVOTEE workflow started"
          echo "Checking available skill files..."

          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | head -200

          echo "Searching for skill instructions:"
          find . -type f -name "SKILL.md" -print

          echo "Repository check completed."
