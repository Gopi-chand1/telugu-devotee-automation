name: TELUGU DEVOTEE Episode Package

# Manual run only: avoids regenerating the same episode and wasting free API quota.
# Review the generated artifact before creating/publishing the video.
on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number"
        required: true
        default: "2"
      episode_title:
        description: "Episode title (Telugu)"
        required: true
        default: "విశ్వామిత్ర మహర్షి రాక నుంచి సీతారామ కళ్యాణం వరకు"
      story_outline:
        description: "Story beats for this episode"
        required: true
        default: "Vishwamitra arrives in Ayodhya and asks Dasharatha for Rama's help. Rama and Lakshmana depart with the sage, learn Bala and Atibala, encounter Tataka, protect the yajna against Maricha and Subahu, visit Ahalya, travel to Mithila, encounter Sita, attend the Shiva bow swayamvar, marry, encounter Parashurama, and return to Ayodhya."
      scene_offset:
        description: "Scene number offset (0 = scenes 1-60, 60 = scenes 61-120)"
        required: true
        default: "0"
      gemini_model:
        description: "Gemini API model name"
        required: true
        default: "gemini-3.8-flash"

permissions:
  contents: read

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate episode package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
          EPISODE_TITLE: ${{ inputs.episode_title }}
          STORY_OUTLINE: ${{ inputs.story_outline }}
          SCENE_OFFSET: ${{ inputs.scene_offset }}
          TOTAL_SCENES: "60"
          BATCH_SIZE: "10"
        run: python3 scripts/generate_episode.py

      - name: Save episode package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telugu-devotee-episode-${{ inputs.episode_number }}
          path: output/episode_package.md
          if-no-files-found: warn
          retention-days: 30
