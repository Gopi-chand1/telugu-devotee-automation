name: TELUGU DEVOTEE Telugu Audio

on:
  workflow_run:
    workflows: ["TELUGU DEVOTEE Episode Package"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest episode checkpoint
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing HF_TOKEN. Add a Hugging Face read token in Settings > Secrets and variables > Actions > New repository secret, named HF_TOKEN."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU TTS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install parler-tts transformers soundfile numpy huggingface_hub

      - name: Generate scene audio (resumes existing WAV files)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EPISODE_MARKDOWN: output/episode_package.md
          AUDIO_OUTPUT_DIR: output/audio
        run: python scripts/generate_telugu_audio.py

      - name: Upload Telugu audio for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telugu-devotee-telugu-audio
          path: output/audio/
          if-no-files-found: warn
          retention-days: 30

      - name: Report review-only safety gate
        if: success()
        run: echo "Audio artifact generated. No video is published and no YouTube upload is performed."
