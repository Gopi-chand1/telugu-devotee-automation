name: TELUGU DEVOTEE Flow Prompt Pack

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Required only for manual runs: run ID that contains the production manifest artifact"
        required: false
        default: "38144490097"
      source_artifact_name:
        description: "Artifact to download for a manual run"
        required: true
        default: "telugu-devotee-episode-2"
  workflow_run:
    workflows: ["TELUGU DEVOTEE Production Manifest Export"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  prepare-prompt-pack:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select source run
        id: source
        env:
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$EVENT_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact_name=telugu-devotee-production-manifest" >> "$GITHUB_OUTPUT"
          elif [ -n "$MANUAL_RUN_ID" ]; then
            echo "run_id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact_name=${{ inputs.source_artifact_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::For a manual run, provide the run ID that created the source artifact."
            exit 1
          fi

      - name: Download existing production manifest (no Gemini call)
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Locate manifest and prepare prompt pack
        run: |
          mkdir -p output
          MANIFEST="$(find downloaded -type f -name production_manifest.csv -print -quit)"
          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" output/production_manifest.csv
          else
            PACKAGE="$(find downloaded -type f -name episode_package.md -print -quit)"
            if [ -z "$PACKAGE" ]; then
              echo "::error::Neither production_manifest.csv nor episode_package.md was found in the selected artifact."
              find downloaded -maxdepth 3 -type f -print || true
              exit 1
            fi
            cp "$PACKAGE" output/episode_package.md
            python scripts/export_production_assets.py
          fi
          python scripts/export_flow_prompt_pack.py

      - name: Upload Flow prompt pack
        uses: actions/upload-artifact@v4
        with:
          name: telugu-devotee-flow-prompt-pack
          path: |
            output/telugu-devotee-flow-prompt-pack.zip
            output/flow_prompt_pack/scene_index.json
          if-no-files-found: error
          retention-days: 30
